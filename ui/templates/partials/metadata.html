<section id="collection-metadata" class="panel metadata-grid" {{if .Fragment}}hx-swap-oob="true"{{end}}><div><small>RECORDS</small><strong>{{.Collection.Rows}}</strong><small><span class="state-label" data-state="{{.Collection.Status}}">{{.Collection.Status}}</span>{{if .Collection.ReadOnly}} · read-only{{end}}</small></div><div><small>FILE SIZE</small><strong>{{bytes .Collection.Size}}</strong></div><div><small>LAST UPDATED</small><strong class="mono small-text">{{.Collection.Updated}}</strong></div><div><small>ENDPOINT STATUS</small><strong id="endpoint-state">{{if .Collection.Enabled}}<span class="status-dot"></span> Active{{else}}Disabled{{end}}</strong></div></section>
