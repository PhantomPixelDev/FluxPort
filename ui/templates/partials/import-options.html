<details class="import-help"><summary>Text import options</summary><div class="toolbar"><label class="field-label">Encoding<select name="encoding" class="field-control"><option value="utf-8">UTF-8 (keep original)</option><option value="windows-1252">Windows-1252</option><option value="utf-16le">UTF-16 little endian</option><option value="utf-16be">UTF-16 big endian</option></select></label><label class="field-label">CSV delimiter<select name="csv_delimiter" class="field-control"><option value="comma">Comma</option><option value="auto">Detect</option><option value="tab">Tab</option><option value="semicolon">Semicolon</option><option value="pipe">Pipe</option></select></label></div><label class="checkbox-setting field-label"><input type="checkbox" name="preview_only" class="field-check"> Preview only (text formats, no import)</label><p class="muted small-text">Non-default text options create a UTF-8 NDJSON file with text cells preserved. Gzip (.gz) text files are decompressed; the stored source is the decompressed file. Other files keep their original bytes.</p></details>
