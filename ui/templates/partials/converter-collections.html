<label for="converter-collection" class="field-label">File<select id="converter-collection" name="collection_id" class="field-control"><option value="">Choose a file…</option>{{range .Collections}}<option value="{{.ID}}" data-format="{{.Format}}" data-rows="{{.Rows}}" data-status="{{.Status}}" {{if eq .ID $.CollectionID}}selected{{end}}>{{.Name}} · {{upper .Format}} · {{.Rows}} rows · {{fileState .Status}}</option>{{end}}</select></label>
{{if gt .Count 100}}<p class="muted small-text">Showing 100 of {{.Count}} files. Search by name to narrow the list.</p>{{else if not .Collections}}<p class="muted">No matching files. <a href="/collections#import">Import a file</a> or change your search.</p>{{end}}
