name: Feature request
description: Describe a data task that FluxPort could make easier.
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Explain the dataset, workflow and current difficulty.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What would a successful result look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternative
